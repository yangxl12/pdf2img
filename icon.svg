<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background: warm cream -->
  <rect width="512" height="512" rx="92" fill="#F7F3EA"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#5D4037" stroke-width="22"/>

  <!-- Inner circle -->
  <circle cx="256" cy="256" r="170" fill="#5D4037"/>

  <!-- Document icon with folded corner -->
  <g transform="translate(256, 256)">
    <!-- Document body -->
    <rect x="-72" y="-90" width="144" height="180" rx="12" fill="#F7F3EA"/>

    <!-- Folded corner -->
    <path d="M 72 -90 L 72 -54 L 36 -54 L 72 -90 Z" fill="#D7CCC8"/>

    <!-- Text lines -->
    <rect x="-52" y="-60" width="80" height="10" rx="5" fill="#8D6E63"/>
    <rect x="-52" y="-38" width="100" height="10" rx="5" fill="#A1887F"/>
    <rect x="-52" y="-16" width="70" height="10" rx="5" fill="#A1887F"/>
    <rect x="-52" y="6"  width="90" height="10" rx="5" fill="#A1887F"/>
    <rect x="-52" y="28" width="60" height="10" rx="5" fill="#A1887F"/>

    <!-- Arrow down / export indicator -->
    <circle cx="0" cy="60" r="20" fill="#5D4037"/>
    <polygon points="0,72 -10,58 10,58" fill="#F7F3EA"/>
  </g>
</svg>
